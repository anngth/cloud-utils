# dbt secrets (database tools).
#
# Live file: $CLOUD_UTILS_CONFIG_DIR/dbt/secrets.toml
# Default dir: ~/Library/Mobile Documents/com~apple~CloudDocs/Backups/cloud-utils
#
# dbt creates this file on first run (converting an old zsh-array `dbt/secrets`
# when one exists). `dbt config` shows what it contains, credentials masked.
#
# Strings go in double quotes; `$`, `|` and `@` need no escaping. Only `"` and
# `\` do (write `\"` and `\\`), or use single quotes for a literal string.

# SSH tunnels: `dbt connect <service>` runs
#   ssh -L <local_port>:<target_host>:<target_port> <user>@<host>
#
# [[tunnels]]
# name = "production"
# user = "admin"
# host = "192.168.1.100"
# service = "postgres"
# local_port = 5432
# target_host = "localhost"
# target_port = 5432

# PostgreSQL sources. `database` defaults to the path of the URL.
#
# [[postgres.sources]]
# name = "prod_db"
# url = "postgresql://user:password@localhost:5432/production"

# PostgreSQL targets. The sync lands in a database named after the source;
# the URL path is only the maintenance database.
#
# [[postgres.targets]]
# name = "cloud_prod"
# url = "postgresql://user:password@db.example.com:5432/postgres?sslmode=require"

# MongoDB sources. Put the auth database in `?authSource=`, not in the path.
#
# [[mongo.sources]]
# name = "prod_mongo"
# uri = "mongodb://user:password@localhost:27017/?authSource=admin"
# databases = ["app_db", "logs_db"]

# MongoDB targets.
#
# [[mongo.targets]]
# name = "cloud_mongo"
# uri = "mongodb://user:password@mongo.example.com:27017"
