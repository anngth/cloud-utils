[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-utils-mac-cli"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "click",
  "prompt-toolkit",
  "pydantic",
  "pyotp",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = [
  "mac_scripts/functions/shared",
  "mac_scripts/functions/twofa",
  "mac_scripts/functions/git_tools",
  "mac_scripts/functions/skills_manager",
  "mac_scripts/functions/db_tools",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "mac_scripts/functions"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PIE", "FURB", "ISC", "C4"]
allowed-confusables = ["ℹ"]

[tool.mypy]
python_version = "3.14"
mypy_path = "mac_scripts/functions"
files = ["mac_scripts/functions/db_tools"]
ignore_missing_imports = true
follow_imports = "silent"
